# A compact tmux status line for local development sessions.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 32
set -g status-right-length 80
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'

set -g status-left '#{?client_prefix,#[bg=#e0af68],#[bg=#7aa2f7]}#[fg=#1a1b26,bold] 󰆍 #S #[bg=#1a1b26]#{?client_prefix,#[fg=#e0af68],#[fg=#7aa2f7]}'
set -g window-status-separator ''
set -g window-status-format '#[bg=#1a1b26,fg=#565f89]  #I:#W #F  '
set -g window-status-current-format '#[bg=#1a1b26,fg=#24283b]#[bg=#24283b,fg=#7dcfff,bold] #I:#W #F #[bg=#1a1b26,fg=#24283b]'
set -g status-right '#[fg=#7aa2f7]#{pane_current_command} #[fg=#3b4261]│ #[fg=#9ece6a]#{b:pane_current_path} #[fg=#3b4261]│ #[fg=#e0af68]%H:%M '
