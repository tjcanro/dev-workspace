version = 1

[project]
name = "dev-workspace"

[dependencies]
required_commands = ["git", "nvim", "tmux", "tmuxp", "rg", "jq", "claude", "ssh", "rsync"]
optional_commands = ["codex", "fd", "gh", "glab", "shellcheck"]

[nvim]
repository = "https://github.com/tjcanro/NvimConfig.git"

[install]
commands = ["workbench", "neo-help", "review-pr", "review-mr", "review-worktree"]

[safety]
public_forbidden_markers = ["colossus-dev", "ipp6-dev", "/home/tcanro", "nvidia.com"]
